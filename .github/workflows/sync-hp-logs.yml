name: Sync HP and Stamina logs

# Publish every campaign's HP and Stamina log from the ComeOnOverUno server.
#
# Lewis, 2026-10-17: "Tongs should record all HP and stamina changes, with
# dates and reasons." Tongs Browser posts each change on a player character
# to the server; GET api/pathwars/campaigns/<code>/hp-history returns them
# with no credentials (a player character's HP is the table's), so this
# PULLS and needs no secret. It writes only to its own repository, with the
# built-in GITHUB_TOKEN.
#
# The server is the source of truth. Every <code>-HP-And-Stamina-Log.md,
# topics/HP-And-Stamina-Logs/ and hp-logs.tree are generated and overwritten.

on:
  schedule:
    # Hourly: a disputed HP drop is asked about during the game, not days later.
    - cron: '35 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-hp-logs
  cancel-in-progress: false

permissions:
  contents: write        # push the bot branch
  pull-requests: write   # open the sync PR

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest

      - name: Test the sync logic
        run: python -m pytest scripts/hp_log_sync scripts/test_no_em_dashes.py -q

      - name: Publish into the wiki
        run: python scripts/hp_log_sync/hp_log_pages.py --server https://cooserver.duckdns.org

      - name: Open or update the sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # main requires an approving review, so the Actions bot cannot push
          # to it (see sync-pbp-transcripts.yml, which found that out). ONE
          # stable branch, regenerated from main on every run, carries the
          # latest pages in one PR.
          BRANCH=bot/hp-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Writerside/topics Writerside/hp-logs.tree
          # Exits 1 when something IS staged: commit only when content changed.
          if git diff --cached --quiet; then
            echo "No HP log changes; nothing to publish."
            exit 0
          fi
          git checkout -b "$BRANCH"
          git commit -m "Sync HP and Stamina logs from the ComeOnOverUno server"
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open for $BRANCH; it now carries the latest logs."
            exit 0
          fi
          # Only "Actions may not create pull requests" is tolerated: the
          # branch push above is the job. Any other failure fails the run.
          set +e
          OUT=$(gh pr create --base main --head "$BRANCH" \
            --title "Sync HP and Stamina logs from the ComeOnOverUno server" \
            --body "Automated HP and Stamina log pages, generated by scripts/hp_log_sync from the ComeOnOverUno server's hp-history. The server is the source of truth and these pages are regenerated every hour." 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ $CODE -ne 0 ]; then
            if echo "$OUT" | grep -q "not permitted to create or approve pull requests"; then
              echo "::warning::Branch $BRANCH is updated, but this repo does not let Actions open PRs."
              echo "::warning::Open one by hand: https://github.com/LewisIsWorking/PathWarsWiki/pull/new/$BRANCH"
              exit 0
            fi
            echo "::error::gh pr create failed for a reason other than policy."
            exit $CODE
          fi
